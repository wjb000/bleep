name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build download bundles
        run: |
          mkdir -p site/downloads
          zip -qr site/downloads/bleep_print_stl.zip cad/stl_print docs/PRINT_GUIDE.md || true
          zip -qr site/downloads/bleep_step.zip cad/step cad/vendor || true
          zip -qr site/downloads/bleep_sim.zip sim/bleep.urdf sim/bleep.xml sim/meshes sim/servo_prior.json sim/home_pose.json || true
          zip -qr site/downloads/bleep_firmware.zip firmware || true
          ls -la site/downloads
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
